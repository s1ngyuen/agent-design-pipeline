name: CI

on:
  push:
    branches: [main]
    paths:
      - scanna/**
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - scanna/**
      - .github/workflows/ci.yml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanna/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: scanna
      - name: Run linter
        run: npm run lint
        working-directory: scanna
      - name: Build project
        run: npm run build
        working-directory: scanna
      - name: Run tests
        run: npm test --if-present
        working-directory: scanna

  migrate:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanna/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: scanna
      - name: Run migrations
        run: npm run db:migrate
        working-directory: scanna
        env:
          DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}

  deploy:
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      # `vercel pull` fetches this project's already-configured Production
      # environment variables (Google/Anthropic/eBay/etc.) directly from
      # Vercel — the source of truth for those values lives in the Vercel
      # project's own Environment Variables settings, not in GitHub Actions
      # secrets. Only these three identifiers are needed here to let a
      # fresh CI checkout (with no local .vercel/ link) authenticate as
      # this specific project.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: scanna
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: scanna
      - name: Deploy project artifacts
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: scanna
