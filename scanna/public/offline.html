<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>You're offline — Scanna</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;

        justify-content: center;
        background: #faf7f1;

        font-family: ui-sans-serif, system-ui, sans-serif;

      }

      }
      p {
        color: #4a4038;

      }

        display: inline-block;
        margin-top: 1.25rem;
        min-height: 44px;
        padding: 12px 20px;

        color: #faf7f1;
        border-radius: 8px;

        font-weight: 600;
      }

  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        This page hasn't been visited yet, so it isn't cached for offline use. Recognition and value estimates

      </p>
      <a href="/scan">Back to Scan</a>
    </div>
